<!doctype html>

  <link rel="stylesheet" href="workbench.css" />

      <div class="brand"><span class="brand-mark">几</span><div><strong>未来整理工作台</strong><small>独立实验版 · 本地模式</small></div></div>
      <nav class="nav" id="collect-nav"><button class="active" data-view="overview"><span class="nav-icon">⌂</span>总览</button></nav>
      <div class="nav-title">工作区</div><nav class="nav"><button data-view="today"><span class="nav-icon">◷</span>今天</button><button data-view="courses"><span class="nav-icon">▦</span>课程表</button><button data-view="plans"><span class="nav-icon">◇</span>计划</button><button data-view="tasks"><span class="nav-icon">☑</span>待办</button><button data-view="ledger"><span class="nav-icon">＄</span>记账</button><button data-view="notes"><span class="nav-icon">✎</span>笔记</button></nav>

    <main class="main">

      <section class="desktop-page-panel capture-panel" hidden></section>
    </main>
  </div>
  <script type="module">
    import { readAppearance, applyAppearance } from './appearance.mjs';
    try { applyAppearance(readAppearance(localStorage), document.documentElement); } catch {}
  </script>
<script type="module" src="prototype-modules.js"></script></body>
