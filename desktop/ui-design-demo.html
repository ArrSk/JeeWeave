<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>几微 · 设计预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#dce5e4;color:#203936;font:15px 'Microsoft YaHei',sans-serif}.app{margin:3vh auto;width:94%;min-height:94vh;background:#f5f8f6;display:grid;grid-template-columns:200px 1fr;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px #34534a22}.side{background:#e8f0ed;padding:34px 20px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:700;margin:0 12px 55px}.brand span{color:#66847a;font-size:13px;margin-left:8px}nav{display:grid;gap:8px}button{font:inherit;cursor:pointer;border:0}nav button{text-align:left;padding:13px 16px;background:transparent;color:#627a72;border-radius:9px;transition:.25s}nav button.active,nav button:hover{background:#d3e4dc;color:#214c3d}.foot{margin-top:auto;color:#708980;font-size:12px;padding:12px}main{padding:42px 6%;position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;color:#789087;font-size:13px}.top button{background:#e4eee8;color:#31594b;border-radius:50%;width:40px;height:40px;font-size:22px}.head{margin-top:50px;display:flex;justify-content:space-between;align-items:end}.head h1{font-size:38px;letter-spacing:-1px;margin:0 0 10px}.head p{margin:0;color:#71877e}.date{font-size:14px;color:#71877e}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:45px;margin-top:55px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.section-title h2{font-size:18px;margin:0}.section-title span{color:#80958c;font-size:12px}.event{display:grid;grid-template-columns:70px 1fr;gap:22px;padding:21px 0;border-top:1px solid #dce7e1}.time{font-size:14px;color:#688479}.event strong{font-size:16px}.event p{font-size:13px;color:#81958d;margin:8px 0 0}.tag{float:right;font-size:12px;color:#5e8d78}.focus{background:#dcebe2;padding:28px;border-radius:14px;min-height:225px}.focus small{color:#6e8c7d}.focus h3{font-size:25px;margin:32px 0 8px}.focus p{color:#658174}.focus button{margin-top:20px;background:#315d4d;color:white;padding:10px 19px;border-radius:8px}.list{margin-top:35px}.item{display:flex;gap:14px;padding:17px 0;border-top:1px solid #dce7e1}.check{width:18px;height:18px;border:1.5px solid #91aa9c;border-radius:50%;background:transparent}.item.done span{text-decoration:line-through;color:#9aaca4}.page{animation:enter .45s cubic-bezier(.16,1,.3,1)}@keyframes enter{from{opacity:.4;transform:translateY(9px)}to{opacity:1;transform:none}}canvas{position:fixed;inset:0;pointer-events:none;z-index:4}@media(max-width:800px){.app{grid-template-columns:72px 1fr}.side{padding:28px 8px}.brand{font-size:16px;margin:0 4px 40px}.brand span,.foot{display:none}nav button{font-size:12px;padding:12px 5px;text-align:center}main{padding:30px}.layout{grid-template-columns:1fr;gap:25px}.head h1{font-size:29px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}canvas{display:none}}
</style><canvas id="dust"></canvas><div class="app"><aside class="side"><div class="brand">几微<span>JeeWeave</span></div><nav><button class="active" data-page="今天">今天</button><button data-page="课程表">课程表</button><button data-page="事项">事项</button><button data-page="笔记">笔记</button><button data-page="对象">对象</button></nav><div class="foot">●　资料留在本机</div></aside><main><div class="top"><span>工作空间 / <span id="crumb">今天</span></span><button aria-label="新建示意" title="新建示意">＋</button></div><div id="page" class="page"><div class="head"><div><h1 id="title">今天，慢慢来。</h1><p id="subtitle">把注意力留给真正重要的事。</p></div><div class="date">10月30日　星期五</div></div><div class="layout"><div><div class="section-title"><h2>今日安排</h2><span>示例内容</span></div><div class="event"><div class="time">09:00</div><div><span class="tag">课程</span><strong>设计与生活</strong><p>第二教学楼 · 302</p></div></div><div class="event"><div class="time">14:00</div><div><span class="tag">专注</span><strong>整理项目思路</strong><p>留一段时间给自己</p></div></div><div class="event"><div class="time">16:30</div><div><span class="tag">事项</span><strong>阅读与记录</strong><p>将想法收集起来</p></div></div></div><div><div class="focus"><small>此刻的重点</small><h3>留白，也是进度。</h3><p>今天还有一些时间，交给你来安排。</p><button id="focus">开始专注</button></div><div class="list"><div class="section-title"><h2>待处理</h2><span>轻点完成</span></div><div class="item"><button class="check" aria-label="完成整理资料"></button><span>整理这周的资料</span></div><div class="item"><button class="check" aria-label="完成记录想法"></button><span>记录新的想法</span></div></div></div></div></div></main></div><script>
const labels={'今天':['今天，慢慢来。','把注意力留给真正重要的事。'],'课程表':['课程表','每一段学习，都有自己的节奏。'],'事项':['事项','让想做的事，有处安放。'],'笔记':['笔记','留下值得记住的片刻。'],'对象':['对象','将相关的事情，放在一起。']};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');document.querySelector('#crumb').textContent=b.dataset.page;document.querySelector('#title').textContent=labels[b.dataset.page][0];document.querySelector('#subtitle').textContent=labels[b.dataset.page][1];const p=document.querySelector('#page');p.classList.remove('page');void p.offsetWidth;p.classList.add('page')});document.querySelectorAll('.check').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('done'));document.querySelector('#focus').onclick=e=>e.target.textContent=e.target.textContent==='开始专注'?'专注中':'开始专注';const c=document.querySelector('#dust'),x=c.getContext('2d');let dots=[],last=0;function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();onresize=size;onpointermove=e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches||Date.now()-last<50)return;last=Date.now();dots.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*.5,vy:-.35,life:1,r:Math.random()*2+1});if(dots.length>35)dots.shift()};function tick(){x.clearRect(0,0,innerWidth,innerHeight);dots=dots.filter(d=>d.life>0);dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;d.life-=.025;x.fillStyle=`rgba(104,155,130,${d.life*.35})`;x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.fill()});requestAnimationFrame(tick)}tick();</script></html>
